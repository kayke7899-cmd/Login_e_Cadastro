<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area de Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <h1>DevSchool</h1>
        <p>Área do aluno</p>
    </header>

    <main>
        <section class="login">
            <h2>Entrar</h2>
            <p class="descricao">Digite os seus dados para acessar a sua conta.</p>
            <form action="">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="Digite o seu email" required><br><br>

                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" placeholder="Digite a sua senha" required><br><br>

                <button type="submit" value="Entrar">Entrar</button>
            </form>
            <p class="cadastro">Não possui uma conta? <a href="cadastro.html">Cadastre-se aqui</a>.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Desenvolvido por Kayke Augusto. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
